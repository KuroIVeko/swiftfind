[package]
name = "everything"
version = "0.1.0"
edition = "2024"

[dependencies]
# gpui comes from a source snapshot of Zed at a pinned commit
# (f8cfc7ed9e57503def9479138894f3139f5400cc), extracted to third_party/zed.
gpui = { path = "third_party/zed/crates/gpui" }
gpui_platform = { path = "third_party/zed/crates/gpui_platform" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
memchr = "2"
parking_lot = "0.12"
rayon = "1"
unicode-segmentation = "1.10"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# Same patches Zed's own workspace applies; gpui relies on them.
[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }

# Local source snapshots instead of slow git fetches (same pinned revisions as Zed).
[patch."https://github.com/gfx-rs/wgpu"]
wgpu = { path = "third_party/wgpu/wgpu" }

[patch."https://github.com/zed-industries/font-kit"]
zed-font-kit = { path = "third_party/font-kit" }

[profile.dev]
# Our own code: light optimization so indexing isn't painfully slow in debug.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
